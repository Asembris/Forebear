<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">Forebear: check a device's 510(k) ancestry before you cite it</title>
  <desc id="d">A timeline from 2010 to 2027. BreathePal Bilevel (K252078), cleared 2026-03-17, cites the BiPAP A30 (K113053), cleared 2012-02-01, on page 6 of its FDA summary. FDA attributes the Class I design recall Z-1957-2021, initiated 2021-06-14, to the BiPAP A30's clearance; the signal reaches BreathePal through that citation. The recall began four years and nine months before BreathePal was cleared. Verdict: review lineage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1322"/>
      <stop offset="1" stop-color="#070c17"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fa2ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7fa2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e7a948" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#e7a948" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thread" x1="1112" y1="0" x2="248" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f1ebdd"/>
      <stop offset="0.45" stop-color="#7fa2ff"/>
      <stop offset="1" stop-color="#5b82f0"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ece6d8" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="640" rx="28"/></clipPath>
  </defs>
  <style>
    .serif { font-family: "Newsreader", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
    .sans  { font-family: "Inter", "Segoe UI", -apple-system, system-ui, Helvetica, Arial, sans-serif; }
    .mono  { font-family: ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, monospace; }
    .ink   { fill: #ece6d8; }
    .ink2  { fill: #ece6d8; fill-opacity: 0.74; }
    .ink3  { fill: #ece6d8; fill-opacity: 0.55; }
    .amber { fill: #e7a948; }
    .blue  { fill: #7fa2ff; }
    /* One 12 s loop. Base styles are the final frame, so reduced motion shows the whole story at rest.
       Story: BreathePal cites K113053, FDA attaches a Class I design recall to K113053, the signal flows
       back up the citation to BreathePal, verdict. Nothing is hidden on any frame; motion only adds emphasis. */
    .cite, .link, .inherit { stroke-dasharray: 1; }
    .cite-comet, .link-comet, .inherit-comet { stroke-dasharray: 0.05 3; opacity: 0; }
    .cand-ping, .pred-ping, .recall-wave, .recall-wave2, .cand-amber { opacity: 0; }
    .cand-ping, .cand-amber { transform-origin: 1112px 450px; }
    .pred-ping { transform-origin: 248px 450px; }
    .diamond, .recall-wave, .recall-wave2 { transform-origin: 820px 450px; }
    .verdict, .verdict-glow { transform-origin: 1070px 74px; }
    .cite { animation: citeDraw 12s linear infinite; }
    .cite-comet { animation: citeComet 12s linear infinite; }
    .cite-label { animation: citeLabel 12s linear infinite; }
    .cand-ping { animation: candPing 12s linear infinite; }
    .pred-ping { animation: predPing 12s linear infinite; }
    .link { animation: linkDraw 12s linear infinite; }
    .link-comet { animation: linkComet 12s linear infinite; }
    .diamond { animation: diamondPop 12s linear infinite; }
    .recall-wave { animation: recallWave 12s linear infinite; }
    .recall-wave2 { animation: recallWave2 12s linear infinite; }
    .recall-label { animation: recallLabel 12s linear infinite; }
    .inherit { animation: inheritDraw 12s linear infinite; }
    .inherit-comet { animation: inheritComet 12s linear infinite; }
    .cand-amber { animation: candAmber 12s linear infinite; }
    .cand-halo { animation: candHalo 12s linear infinite; }
    .gap { animation: gapLabel 12s linear infinite; }
    .verdict { animation: verdict 12s linear infinite; }
    .verdict-glow { animation: verdictGlow 12s linear infinite; }
    @keyframes citeDraw { 0%, 4% { stroke-dashoffset: 1; opacity: 1; } 22%, 89% { stroke-dashoffset: 0; opacity: 1; } 96% { stroke-dashoffset: 0; opacity: 0; } 100% { stroke-dashoffset: 1; opacity: 0; } }
    @keyframes citeComet { 0%, 4% { stroke-dashoffset: 0.05; opacity: 0; } 4.5% { opacity: 1; } 22% { stroke-dashoffset: -0.97; opacity: 1; } 24%, 100% { stroke-dashoffset: -0.97; opacity: 0; } }
    @keyframes citeLabel { 0%, 15% { opacity: 0.28; } 19%, 89% { opacity: 1; } 96%, 100% { opacity: 0.28; } }
    @keyframes candPing { 0%, 0% { transform: scale(1); opacity: 0; } 0.5% { opacity: 0.9; } 11%, 100% { transform: scale(4.2); opacity: 0; } }
    @keyframes predPing { 0%, 22% { transform: scale(1); opacity: 0; } 22.5% { opacity: 0.9; } 33%, 100% { transform: scale(4.2); opacity: 0; } }
    @keyframes linkDraw { 0%, 28% { stroke-dashoffset: 1; opacity: 1; } 40%, 89% { stroke-dashoffset: 0; opacity: 1; } 96% { stroke-dashoffset: 0; opacity: 0; } 100% { stroke-dashoffset: 1; opacity: 0; } }
    @keyframes linkComet { 0%, 28% { stroke-dashoffset: 0.05; opacity: 0; } 28.5% { opacity: 1; } 40% { stroke-dashoffset: -0.97; opacity: 1; } 42%, 100% { stroke-dashoffset: -0.97; opacity: 0; } }
    @keyframes diamondPop { 0%, 40% { transform: scale(0.55); opacity: 0.35; } 43% { transform: scale(1.45); opacity: 1; } 47%, 89% { transform: scale(1); opacity: 1; } 96%, 100% { transform: scale(0.55); opacity: 0.35; } }
    @keyframes recallWave { 0%, 40% { transform: scale(1); opacity: 0; } 40.5% { opacity: 0.9; } 51%, 100% { transform: scale(4.2); opacity: 0; } }
    @keyframes recallWave2 { 0%, 43% { transform: scale(1); opacity: 0; } 43.5% { opacity: 0.9; } 54%, 100% { transform: scale(4.2); opacity: 0; } }
    @keyframes recallLabel { 0%, 40% { opacity: 0.28; } 44%, 89% { opacity: 1; } 96%, 100% { opacity: 0.28; } }
    @keyframes inheritDraw { 0%, 48% { stroke-dashoffset: 1; opacity: 1; } 62%, 89% { stroke-dashoffset: 0; opacity: 1; } 96% { stroke-dashoffset: 0; opacity: 0; } 100% { stroke-dashoffset: 1; opacity: 0; } }
    @keyframes inheritComet { 0%, 48% { stroke-dashoffset: 0.05; opacity: 0; } 48.5% { opacity: 1; } 62% { stroke-dashoffset: -0.97; opacity: 1; } 64%, 100% { stroke-dashoffset: -0.97; opacity: 0; } }
    @keyframes candAmber { 0%, 62% { transform: scale(1); opacity: 0; } 62.5% { opacity: 0.9; } 73%, 100% { transform: scale(4.2); opacity: 0; } }
    @keyframes candHalo { 0%, 62% { opacity: 0; } 66%, 89% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes gapLabel { 0%, 63% { opacity: 0.12; } 67%, 89% { opacity: 1; } 96%, 100% { opacity: 0.12; } }
    @keyframes verdict { 0%, 66% { opacity: 0.28; transform: scale(0.96); } 69% { opacity: 1; transform: scale(1.06); } 72%, 89% { opacity: 1; transform: scale(1); } 96%, 100% { opacity: 0.28; transform: scale(0.96); } }
    @keyframes verdictGlow { 0%, 66% { opacity: 0; } 70% { opacity: 0.9; } 78% { opacity: 0.35; } 84% { opacity: 0.7; } 89% { opacity: 0.35; } 96%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .cite, .link, .inherit, .cite-label, .diamond, .recall-label, .cand-halo, .gap, .verdict { animation: none; }
      .cite-comet, .link-comet, .inherit-comet, .cand-ping, .pred-ping, .recall-wave, .recall-wave2, .cand-amber, .verdict-glow { animation: none; opacity: 0; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="640" fill="url(#bg)"/>
    <rect width="1280" height="640" fill="url(#dots)"/>
    <ellipse cx="680" cy="330" rx="520" ry="200" fill="url(#glowBlue)"/>
    <ellipse cx="820" cy="450" rx="190" ry="120" fill="url(#glowAmber)"/>

    <!-- Mark: an F drawn as a lineage graph (geometry from web/src/brand/Mark.jsx) -->
    <g transform="translate(92 58) scale(2.5)" stroke-linecap="round">
      <g stroke="#7fa2ff" stroke-width="1.5">
        <line x1="11" y1="7" x2="27" y2="7"/>
        <line x1="11" y1="7" x2="11" y2="19"/>
        <line x1="11" y1="19" x2="23" y2="19"/>
        <line x1="11" y1="19" x2="11" y2="31"/>
      </g>
      <circle cx="11" cy="7" r="3.6" fill="#f1ebdd"/>
      <circle cx="27" cy="7" r="2.8" fill="#7fa2ff"/>
      <circle cx="11" cy="19" r="3.0" fill="#7fa2ff"/>
      <circle cx="23" cy="19" r="2.6" fill="#7fa2ff"/>
      <circle cx="11" cy="31" r="3.4" fill="#e7a948"/>
    </g>

    <text x="212" y="134" class="serif ink" font-size="86" letter-spacing="-1.5">Forebear</text>
    <text x="214" y="182" class="sans ink2" font-size="25">Check a device's 510(k) ancestry before you cite it.</text>
    <text x="214" y="220" class="mono ink3" font-size="15" letter-spacing="2.2">FDA PREDICATE LINEAGE  ·  RECALL EVIDENCE  ·  ONE RELATE FILE</text>

    <!-- Verdict: the assessment the shipped store returns for K252078 (climax of the loop) -->
    <rect class="verdict-glow" x="946" y="46" width="248" height="56" rx="28" fill="none" stroke="#e7a948" stroke-width="6" stroke-opacity="0.35"/>
    <g class="verdict">
      <rect x="952" y="52" width="236" height="44" rx="22" fill="#e7a948" fill-opacity="0.14" stroke="#e7a948" stroke-opacity="0.8"/>
      <circle cx="976" cy="74" r="5" fill="#e7a948"/>
      <text x="992" y="79" class="mono amber" font-size="15" letter-spacing="1.6">REVIEW LINEAGE</text>
      <text x="1188" y="124" text-anchor="end" class="sans ink3" font-size="16">deterministic verdict for K252078</text>
    </g>

    <!-- Time axis 2010 to 2027 (x = 120 + (year - 2010) * 61.18) -->
    <g class="mono ink3" font-size="15" text-anchor="middle">
      <line x1="96" y1="450" x2="1184" y2="450" stroke="#ece6d8" stroke-opacity="0.16"/>
      <g stroke="#ece6d8" stroke-opacity="0.22">
        <line x1="120" y1="444" x2="120" y2="456"/><line x1="426" y1="444" x2="426" y2="456"/>
        <line x1="732" y1="444" x2="732" y2="456"/><line x1="1039" y1="444" x2="1039" y2="456"/>
      </g>
      <text x="120" y="426">2010</text><text x="426" y="426">2015</text>
      <text x="732" y="426">2020</text><text x="1039" y="426">2025</text>
    </g>

    <!-- Resting thread: always visible, so any frame reads as "BreathePal cites the BiPAP A30" -->
    <path d="M1112 450 C 1010 262, 350 262, 248 450" fill="none" stroke="#7fa2ff" stroke-opacity="0.3" stroke-width="1.6" stroke-dasharray="3 7"/>

    <!-- 1. Citation: drawn from BreathePal back in time to its predicate -->
    <path class="cite" d="M1112 450 C 1010 262, 350 262, 248 450" pathLength="1" fill="none" stroke="#7fa2ff" stroke-opacity="0.16" stroke-width="12"/>
    <path class="cite" d="M1112 450 C 1010 262, 350 262, 248 450" pathLength="1" fill="none" stroke="url(#thread)" stroke-width="2.4" stroke-linecap="round"/>
    <path class="cite-comet" d="M1112 450 C 1010 262, 350 262, 248 450" pathLength="1" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

    <!-- 2. FDA attaches the recall to the predicate's clearance -->
    <path class="link" d="M248 450 H820" pathLength="1" fill="none" stroke="#e7a948" stroke-opacity="0.85" stroke-width="2.4" stroke-linecap="round"/>
    <path class="link-comet" d="M248 450 H820" pathLength="1" fill="none" stroke="#fff3da" stroke-width="5" stroke-linecap="round"/>

    <!-- 3. The signal flows back up the citation to the candidate -->
    <path class="inherit" d="M248 450 C 350 262, 1010 262, 1112 450" pathLength="1" fill="none" stroke="#e7a948" stroke-opacity="0.18" stroke-width="12"/>
    <path class="inherit" d="M248 450 C 350 262, 1010 262, 1112 450" pathLength="1" fill="none" stroke="#e7a948" stroke-width="2.4" stroke-linecap="round"/>
    <path class="inherit-comet" d="M248 450 C 350 262, 1010 262, 1112 450" pathLength="1" fill="none" stroke="#fff3da" stroke-width="5" stroke-linecap="round"/>

    <!-- Citation label sits above both threads -->
    <g class="cite-label">
      <rect x="545" y="285" width="270" height="38" rx="19" fill="#0b1322" stroke="#7fa2ff" stroke-opacity="0.45"/>
      <text x="680" y="310" text-anchor="middle" class="mono blue" font-size="16" letter-spacing="0.6">CITES  ·  summary p. 6</text>
    </g>

    <!-- Predicate: K113053 -->
    <circle class="pred-ping" cx="248" cy="450" r="10" fill="none" stroke="#7fa2ff" stroke-width="1.5"/>
    <circle cx="248" cy="450" r="16" fill="#7fa2ff" fill-opacity="0.15"/>
    <circle cx="248" cy="450" r="8" fill="#7fa2ff"/>
    <g class="sans" text-anchor="middle">
      <text x="248" y="492" class="mono blue" font-size="20">K113053</text>
      <text x="248" y="519" class="ink" font-size="19">BiPAP A30</text>
      <text x="248" y="544" class="ink3" font-size="16">predicate · cleared 2012-02-01</text>
    </g>

    <!-- Recall: Z-1957-2021, Class I, root cause Device Design, attributed by FDA to K113053 -->
    <circle class="recall-wave" cx="820" cy="450" r="12" fill="none" stroke="#e7a948" stroke-width="2"/>
    <circle class="recall-wave2" cx="820" cy="450" r="12" fill="none" stroke="#e7a948" stroke-width="1"/>
    <g class="diamond">
      <rect x="806" y="436" width="28" height="28" transform="rotate(45 820 450)" fill="none" stroke="#e7a948" stroke-width="1.5" stroke-opacity="0.7"/>
      <rect x="811" y="441" width="18" height="18" transform="rotate(45 820 450)" fill="#e7a948"/>
    </g>
    <g class="sans recall-label" text-anchor="middle">
      <text x="820" y="492" class="mono amber" font-size="20">Z-1957-2021</text>
      <text x="820" y="519" class="ink" font-size="19">Class I · Device Design</text>
      <text x="820" y="544" class="ink3" font-size="16">on K113053 · initiated 2021-06-14</text>
    </g>

    <!-- Candidate: K252078 -->
    <circle class="cand-ping" cx="1112" cy="450" r="11" fill="none" stroke="#f1ebdd" stroke-width="1.5"/>
    <circle class="cand-amber" cx="1112" cy="450" r="11" fill="none" stroke="#e7a948" stroke-width="2"/>
    <circle class="cand-halo" cx="1112" cy="450" r="20" fill="none" stroke="#e7a948" stroke-width="2"/>
    <circle cx="1112" cy="450" r="18" fill="#f1ebdd" fill-opacity="0.12"/>
    <circle cx="1112" cy="450" r="9" fill="#f1ebdd"/>
    <g class="sans" text-anchor="middle">
      <text x="1112" y="492" class="mono ink" font-size="20">K252078</text>
      <text x="1112" y="519" class="ink" font-size="19">BreathePal Bilevel</text>
      <text x="1112" y="544" class="ink3" font-size="16">candidate · cleared 2026-03-17</text>
    </g>

    <!-- Gap between recall start and clearance -->
    <g class="gap">
      <path d="M820 572 v10 H1112 v-10" fill="none" stroke="#e7a948" stroke-opacity="0.7" stroke-width="1.4"/>
      <text x="966" y="608" text-anchor="middle" class="sans amber" font-size="16">recall began 4 yr 9 mo before the citing clearance</text>
    </g>
    <text x="96" y="608" class="sans ink3" font-size="15">Read from FDA records in data/forebear.rl · pinned by tests</text>
  </g>
</svg>
