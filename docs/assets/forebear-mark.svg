<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Forebear mark: the letter F drawn as a lineage graph">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#070c17"/>
    </linearGradient>
  </defs>
  <style>
    .past { transform-origin: 41px 102px; animation: glow 3.2s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { opacity: 0.25; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.5); } }
    @media (prefers-reduced-motion: reduce) { .past { animation: none; } }
  </style>
  <rect width="128" height="128" rx="28" fill="url(#tile)"/>
  <rect x="0.5" y="0.5" width="127" height="127" rx="27.5" fill="none" stroke="#ece6d8" stroke-opacity="0.12"/>
  <circle class="past" cx="41" cy="102" r="12" fill="#e7a948" fill-opacity="0.35"/>
  <g transform="translate(8 9) scale(3)" stroke-linecap="round">
    <g stroke="#7fa2ff" stroke-width="1.5">
      <line x1="11" y1="7" x2="27" y2="7"/>
      <line x1="11" y1="7" x2="11" y2="19"/>
      <line x1="11" y1="19" x2="23" y2="19"/>
      <line x1="11" y1="19" x2="11" y2="31"/>
    </g>
    <circle cx="11" cy="7" r="3.6" fill="#f1ebdd"/>
    <circle cx="27" cy="7" r="2.8" fill="#7fa2ff"/>
    <circle cx="11" cy="19" r="3.0" fill="#7fa2ff"/>
    <circle cx="23" cy="19" r="2.6" fill="#7fa2ff"/>
    <circle cx="11" cy="31" r="3.4" fill="#e7a948"/>
  </g>
</svg>
