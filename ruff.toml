# Lint baseline enforced in CI: syntax errors, undefined names, unused imports and variables.
# Style is not enforced; widen `select` deliberately, one rule family at a time.
target-version = "py312"
line-length = 130
extend-exclude = ["data", "web", "tools", ".pytest_tmp", "eval/legacy"]

[lint]
select = ["E4", "E7", "E9", "F"]
