name: Repository hygiene

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  commit-messages:
    name: Commit messages
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same rule as the local .githooks/commit-msg hook: one-line Conventional Commit, no trailers.
      - name: Check every commit in the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            if ! sh .githooks/commit-msg "$RUNNER_TEMP/msg" 2> "$RUNNER_TEMP/err"; then
              echo "::error title=Commit ${sha:0:7}::$(head -n 1 "$RUNNER_TEMP/err")"
              git log -1 --format='  %h %s' "$sha"
              status=1
            fi
          done
          exit $status
