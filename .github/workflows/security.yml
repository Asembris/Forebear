name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Dependency review needs the repository's dependency graph to be enabled (private repositories also
  # need GitHub Code Security). This job calls the same compare endpoint the action uses; while it is
  # unavailable (HTTP 403/404) the review is skipped (reported as skipped, never as passed).
  dependency-review-support:
    name: Check dependency review support
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Probe the dependency graph API
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dependency-graph/compare/$BASE_SHA...$HEAD_SHA")
          case "$code" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            403|404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              msg="Dependency review was NOT run: the dependency graph API returned HTTP $code. Enable the dependency graph in the repository's security settings (private repositories also need GitHub Code Security)."
              echo "::warning title=Dependency review skipped::$msg"
              printf '### Dependency review not run\n\n%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error title=Dependency graph probe failed::Unexpected HTTP $code from the dependency graph API."
              exit 1
              ;;
          esac

  dependency-review:
    name: Dependency review
    needs: dependency-review-support
    if: needs.dependency-review-support.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  python-audit:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Audit requirements
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit --progress-spinner off --desc -r requirements.txt -r requirements-ocr.txt

  node-audit:
    name: Node dependency audit (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies, including dev tooling
        run: npm audit --audit-level=critical

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: git --redact --no-banner --exit-code 1 --log-level info .
